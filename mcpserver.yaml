apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-server-k8s-mcp-server-kubernetes
  namespace: default
  labels:
    app.kubernetes.io/instance: mcp-server-k8s
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: mcp-server-kubernetes
    app.kubernetes.io/version: "2.8.0"
    helm.sh/chart: mcp-server-kubernetes-2.8.0
    krupesh: "false"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: mcp-server-k8s
      app.kubernetes.io/name: mcp-server-kubernetes
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: mcp-server-k8s
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: mcp-server-kubernetes
        app.kubernetes.io/version: "2.8.0"
        helm.sh/chart: mcp-server-kubernetes-2.8.0
      annotations:
        checksum/config: e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
    spec:
      serviceAccountName: mcp-server-k8s-mcp-server-kubernetes
      securityContext:
        fsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      containers:
      - name: mcp-server
        image: flux159/mcp-server-kubernetes:v3.0.4
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3001
          name: http
          protocol: TCP
        env:
        - name: ENABLE_UNSAFE_STREAMABLE_HTTP_TRANSPORT
          value: "true"
        - name: PORT
          value: "3001"
        - name: HOST
          value: "0.0.0.0"
        - name: ALLOW_ONLY_NON_DESTRUCTIVE_TOOLS
          value: "false"
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "100m"
            memory: "128Mi"
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: false
          runAsNonRoot: true
          runAsUser: 1000
