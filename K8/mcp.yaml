# Source: mcp-server-kubernetes/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-server-k8s-mcp-server-kubernetes
  labels:
    krupesh: "false"
    helm.sh/chart: mcp-server-kubernetes-2.8.0
    app.kubernetes.io/name: mcp-server-kubernetes
    app.kubernetes.io/instance: mcp-server-k8s
    app.kubernetes.io/version: "2.8.0"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp-server-kubernetes
      app.kubernetes.io/instance: mcp-server-k8s
  template:
    metadata:
      annotations:
        checksum/config: e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
      labels:
        helm.sh/chart: mcp-server-kubernetes-2.8.0
        app.kubernetes.io/name: mcp-server-kubernetes
        app.kubernetes.io/instance: mcp-server-k8s
        app.kubernetes.io/version: "2.8.0"
        app.kubernetes.io/managed-by: Helm
    spec:
      serviceAccountName: mcp-server-k8s-mcp-server-kubernetes
      securityContext:
        fsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      containers:
      - name: mcp-server
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1000
        image: "flux159/mcp-server-kubernetes:latest"
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 3001
          protocol: TCP
        env:
        # Transport configuration
        - name: ENABLE_UNSAFE_STREAMABLE_HTTP_TRANSPORT
          value: "true"
        - name: PORT
          value: "3001"
        - name: HOST
          value: "0.0.0.0"

        # Security configuration
        - name: ALLOW_ONLY_NON_DESTRUCTIVE_TOOLS
          value: "true"
        # Kubeconfig configuration

        # Additional environment variables
        volumeMounts:
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 128Mi
      volumes:
