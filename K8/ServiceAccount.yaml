apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcp-k8s
  namespace: mcp-system

---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mcp-k8s-read
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "nodes", "namespaces", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets"]
    verbs: ["get", "list", "watch"]

---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mcp-k8s-read
subjects:
  - kind: ServiceAccount
    name: mcp-k8s
    namespace: mcp-system
roleRef:
  kind: ClusterRole
  name: mcp-k8s-read
  apiGroup: rbac.authorization.k8s.io

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubernetes-mcp-server
  namespace: mcp-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kubernetes-mcp-server
  template:
    metadata:
      labels:
        app: kubernetes-mcp-server
    spec:
      serviceAccountName: mcp-k8s
      containers:
        - name: mcp-server
          image: flux159/mcp-server-kubernetes:latest
          args:
            - "--transport=http"
            - "--port=8080"
          ports:
            - containerPort: 8080
